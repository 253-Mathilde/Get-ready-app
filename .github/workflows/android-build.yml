name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java einrichten (für Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Abhängigkeiten installieren
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Capacitor initialisieren und Android hinzufügen
        run: |
          npx cap init prête com.mathilde.prete --web-dir=.
          npx cap add android
          npx cap sync android

      - name: Android APK bauen (Gradle)
        run: |
          cd android && ./gradlew assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: prete-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

