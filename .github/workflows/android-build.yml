name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java einrichten (für Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Web-Ordner für Capacitor vorbereiten
        run: |
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ ./www/

      - name: Abhängigkeiten installieren
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Alten Android-Ordner entfernen falls vorhanden
        run: rm -rf android

      - name: Capacitor Android-Projekt frisch erzeugen
        run: |
          npx cap init prête com.mathilde.prete --web-dir=www
          npx cap add android

      - name: Eigenes Android-Setup ausführen (Icons & Vollbild)
        run: node setup-android.js

      - name: Capacitor Synchronisation abschließen
        run: |
          npx cap sync android

      - name: Android APK bauen (Gradle Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: APK automatisch zipalignen und signieren
        uses: iliaminkov/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Fertig signierte APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: prete-signed-app
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
