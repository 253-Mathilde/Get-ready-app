name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java einrichten (für Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Web-Ordner für Capacitor vorbereiten
        run: |
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ ./www/

      - name: Abhängigkeiten installieren
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Alten Android-Ordner entfernen falls vorhanden
        run: rm -rf android

      - name: Capacitor Android-Projekt frisch erzeugen
        run: |
          npx cap init prête com.mathilde.prete --web-dir=www
          npx cap add android

      - name: Eigenes Android-Setup ausführen (Icons & Vollbild)
        run: node setup-android.js

      - name: Capacitor Synchronisation abschließen
        run: |
          npx cap sync android

      - name: Android APK bauen (Gradle Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: APK manuell zipalignen und signieren
        run: |
          # 1. Base64-Schlüssel wieder in eine echte Keystore-Datei zurückverwandeln
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > my-release-key.keystore
          
          # 2. Den Pfad zum Android Build-Tools Ordner finden, wo zipalign und apksigner liegen
          BUILD_TOOLS_DIR=$(dirname $(find $ANDROID_HOME/build-tools -name apksigner | head -n 1))
          
          # 3. Das unverarbeitete APK optimieren (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk prete-aligned.apk
          
          # 4. Das optimierte APK offiziell signieren
          $BUILD_TOOLS_DIR/apksigner sign --ks my-release-key.keystore --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" --ks-key-pass pass:"${{ secrets.KEY_PASSWORD }}" --out prete-signed.apk prete-aligned.apk

      - name: Fertig signierte APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: prete-signed-app
          path: prete-signed.apk
