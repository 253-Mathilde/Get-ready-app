name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java einrichten (für Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Web-Ordner für Capacitor vorbereiten
        run: |
          mkdir www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ ./www/

      - name: Abhängigkeiten installieren
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Capacitor initialisieren und Android hinzufügen
        run: |
          npx cap init prête com.mathilde.prete --web-dir=www
          npx cap add android

      - name: App-Icon im Android-System registrieren
        run: |
          # Erstellt die Standard-Ordner für App-Icons in Android, falls sie fehlen
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Kopiert dein Icon als offizielles System-Launcher-Icon in alle Auflösungen
          cp "app icon (2).png" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp "app icon (2).png" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp "app icon (2).png" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Vollbildmodus erzwingen (Balken entfernen)
        run: |
          # Erlaubt der App, die Ränder der Kamera-Notch (Edge-to-Edge) nativ komplett zu überlagern
          sed -i '/<application/a \        android:windowLayoutInDisplayCutoutMode="shortEdges"' android/app/src/main/AndroidManifest.xml
          
          # Native Anweisung im Android-Theme einbrennen, damit System-Balken ausgeblendet werden
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>' android/app/src/main/res/values/styles.xml

      - name: Capacitor Synchronisation abschließen
        run: |
          npx cap sync android

      - name: Android APK bauen (Gradle)
        run: |
          cd android && ./gradlew assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: prete-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

